name: Build
on: [push, pull_request]
permissions:
  contents: read

jobs:
  build_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: cargo build
        run: cargo build --workspace
      - name: cargo test
        run: cargo test --workspace
