name: Build
on: [push, pull_request]
permissions:
  contents: read

jobs:
  build_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: cargo build
        run: cargo build --workspace
      - name: cargo test
        run: cargo test --workspace
